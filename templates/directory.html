{% extends "base.html" %}
{% block content %}
<header>
  <h1>Local Pages</h1>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button>Sign out</button>
  </form>
</header>
{% if request.user.is_staff %}<nav><a href="{% url 'admin_home' %}">Manage Pages</a></nav>{% endif %}
<ul aria-label="Published Pages">
  {% for title, url in pages %}
  <li><a href="{{ url }}">{{ title }} <span aria-hidden="true">↗</span></a></li>
  {% empty %}
  <li><a href="{{ page_url }}">Welcome <span aria-hidden="true">↗</span></a></li>
  {% endfor %}
</ul>
{% endblock %}
